  const sh=document.createElement('div');sh.className='sheet';sh.innerHTML=`<button class="x" aria-label="Close">×</button><p class="eyebrow">#${s.rank} by calls · ${s.calls} calls since 2023</p><h3>${esc(s.n)}</h3>${pathHtml(s.sec)}
   ${lo!=null?`<p class="muted" style="margin:8px 0 0">Numbers about ${lo}–${hi}</p>`:''}
   ${s.x.length?`<p style="margin:8px 0 0"><b>Crosses:</b> ${esc(s.x.map(x=>x[0]).join(' · '))}</p>`:''}
   ${top.length?`<p style="margin:8px 0 0"><b>Repeat addresses:</b> ${top.map(p=>`${esc(p.a)} (${p.c})`).join(', ')}</p>`:''}`;
  $('#mhost').appendChild(sh);$('.x',sh).onclick=closeSheet;
  if(fit)requestAnimationFrame(()=>mapApi.fit(mapApi.bbOf([s.k],[[0,0]]),0.12));
}
/* ---------- Progress ---------- */
function renderProgress(){
  const v=$('#v-progress');const days=Object.entries(state.days).sort();const last7=[];const d=new Date();for(let i=6;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);const k=x.toLocaleDateString('en-CA');last7.push([k,state.days[k]])}
  const tot=days.reduce((a,[,x])=>a+x.n,0), ok=days.reduce((a,[,x])=>a+x.ok,0), ms=days.reduce((a,[,x])=>a+x.ms,0);
  const weak=ITEMS.filter(i=>state.items[i.id]).map(i=>({i,r:state.items[i.id]})).sort((a,b)=>(b.r[4]-a.r[4])||(a.r[0]-b.r[0])).slice(0,8);
  const maxN=Math.max(1,...last7.map(([,x])=>x?x.n:0));
  v.innerHTML=`<div class="stack"><div><p class="eyebrow">Progress</p><h2>${tot?`${tot} answers so far`:'No answers yet'}</h2></div>
   <div class="statgrid"><div><b>${tot?Math.round(100*ok/tot):0}%</b><span>accuracy</span></div><div><b>${tot?fmtMs(ms/tot):'–'}</b><span>average answer</span></div><div><b>${streak()}</b><span>day streak</span></div></div>
   <div class="card"><p class="eyebrow">Last 7 days</p><svg viewBox="0 0 700 150" width="100%" role="img" aria-label="Answers per day, last 7 days">${last7.map(([k,x],i)=>{const n=x?x.n:0;const h=n/maxN*100;const acc=x&&x.n?x.ok/x.n:0;return `<rect x="${i*100+18}" y="${118-h}" width="64" height="${Math.max(h,1)}" rx="4" style="fill:var(--accent)" fill-opacity="${n?0.35+0.65*acc:0.15}"/><text x="${i*100+50}" y="140" text-anchor="middle" font-size="15" style="fill:var(--muted);font-family:var(--f-body)">${new Date(k+'T12:00').toLocaleDateString('en-US',{weekday:'short'})}</text>${n?`<text x="${i*100+50}" y="${112-h}" text-anchor="middle" font-size="15" style="fill:var(--ink);font-family:var(--f-mono)">${n}</text>`:''}`}).join('')}</svg><p class="muted" style="font-size:12.5px;margin:0">Bar height is answers; darker bars mean higher accuracy.</p></div>
   <div class="card"><p class="eyebrow">Tiers</p>${TIERS.map(t=>{const x=tierStats(t.id);return `<div class="tier" style="margin-bottom:12px"><div><b>${t.name}</b> ${t.id>state.settings.unlocked?'<span class="muted">· locked</span>':''}<div class="muted" style="font-size:13px">${x.intro} of ${x.n} started · ${x.solid} solid · ${x.mast} mastered</div></div><div class="mono">${Math.round(100*x.mast/x.n)}%</div><div class="bar"><i class="m" style="width:${100*x.mast/x.n}%"></i><i class="s" style="width:${100*(x.solid-x.mast)/x.n}%"></i><i class="n" style="width:${100*(x.intro-x.solid)/x.n}%"></i></div></div>`}).join('')}
    <p class="muted" style="font-size:13px">Solid: you'd likely still know it in 3 days. Mastered: a week out, answered on time. The next tier opens when this one is 70% started and half solid.</p>
    ${state.settings.unlocked<3?`<button class="btn ghost" id="unlock">Open ${TIERS[state.settings.unlocked].name} now</button>`:''}</div>
   <div class="card"><p class="eyebrow">Needs work</p>${weak.length?weak.map(({i,r})=>`<div class="weak"><div>${esc(ST[i.k].n)} <span>· ${TYPES[i.type].name}${i.type==='w'?' · '+esc(SEC[i.sec].name):''}</span></div><span class="mono">${r[4]} miss${r[4]===1?'':'es'}</span></div>`).join(''):'<p class="muted">Nothing yet. Misses show up here.</p>'}</div>
   <div class="card"><p class="eyebrow">Data</p><p class="muted" style="font-size:13.5px">Built from ${D.meta.calls.toLocaleString()} Station 8 first-due calls (${D.meta.years}). ${D.streets.length} streets, ${D.addrs.length.toLocaleString()} call addresses. Road shapes from the U.S. Census Bureau; drive routes computed at normal car speeds. Your progress: ${esc(syncMsg.toLowerCase())}.</p><div class="row wrap"><button class="btn ghost" id="exportP">Copy progress</button><button class="btn ghost" id="importP">Paste progress</button></div><div id="pbox" hidden style="margin-top:10px"><textarea id="ptext" rows="4" style="width:100%;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px"></textarea><div class="row" style="margin-top:6px"><span class="muted" id="pmsg" style="font-size:13px"></span><span class="spacer"></span><button class="btn" id="pload" hidden>Load it</button></div></div></div>
  </div>`;
  $('#exportP',v).onclick=async()=>{const txt=JSON.stringify(state);$('#pbox',v).hidden=false;$('#pload',v).hidden=true;const ta=$('#ptext',v);ta.value=txt;try{await navigator.clipboard.writeText(txt);$('#pmsg',v).textContent='Copied. In the other version, tap Paste progress.'}catch(e){ta.focus();ta.select();$('#pmsg',v).textContent='Select all of this text and copy it.'}};
  $('#importP',v).onclick=()=>{$('#pbox',v).hidden=false;$('#ptext',v).value='';$('#pmsg',v).textContent='Paste the progress you copied, then tap Load it.';$('#pload',v).hidden=false};
  $('#pload',v).onclick=()=>{try{const s2=JSON.parse($('#ptext',v).value);if(!s2||s2.v!==1||!s2.items)throw 0;const keep={cov:state.cov,driven:state.driven};state=Object.assign(blankState(),s2,{settings:Object.assign(blankState().settings,s2.settings||{})});if(!s2.cov)Object.assign(state,keep);state.updated=Date.now();save();flushDb();renderProgress();renderTop();$('#pmsg',v).textContent='Progress loaded.'}catch(e){$('#pmsg',v).textContent='That text is not saved progress from First Due 8.'}};
  const u=$('#unlock',v);if(u)u.onclick=()=>{state.settings.unlocked=Math.min(3,state.settings.unlocked+1);save();renderProgress()};
}
/* ---------- Drive mode ---------- */
const canGPS=PWA&&'geolocation' in navigator;
function sampleLine(pt,step){const out=[];let carry=step/2;for(let i=1;i<pt.length;i++){const a=pt[i-1],b=pt[i];const l=Math.hypot(b[0]-a[0],b[1]-a[1]);let dd=carry;while(dd<=l){out.push([a[0]+(b[0]-a[0])*dd/l,a[1]+(b[1]-a[1])*dd/l]);dd+=step}carry=dd-l}if(!out.length&&pt.length)out.push(pt[Math.floor(pt.length/2)]);return out}
D.streets.forEach(s=>{s.ch=s.pp.flatMap(pt=>sampleLine(pt,40))});
const GRID=new Map();const gkey=(x,y)=>Math.floor(x/120)+':'+Math.floor(y/120);
D.streets.forEach(s=>s.ch.forEach((c,i)=>{const k=gkey(c[0],c[1]);if(!GRID.has(k))GRID.set(k,[]);GRID.get(k).push([s.k,i])}));
function covOf(k){return (state.cov&&state.cov[k])||[]}
function covFrac(s){return s.ch.length?Math.min(1,covOf(s.k).length/s.ch.length):0}
function chunksNear(x,y,r=30){const hit=[];const gx=Math.floor(x/120),gy=Math.floor(y/120);for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const L=GRID.get((gx+dx)+':'+(gy+dy));if(!L)continue;for(const [k,i] of L){const c=ST[k].ch[i];if(Math.hypot(c[0]-x,c[1]-y)<=r)hit.push([k,i])}}return hit}
function coverageStats(){let tot=0,dr=0,wt=0,wd=0;for(const s of D.streets){tot+=s.ch.length;const c=covOf(s.k).length;dr+=Math.min(c,s.ch.length);wt+=s.w;wd+=s.w*covFrac(s)}return {len:tot?dr/tot:0,calls:wt?wd/wt:0}}
function weakness(k){let w=0;ITEMS.forEach(i=>{if(i.k!==k)return;const r=state.items[i.id];if(!r)w+=0.3;else{w+=r[4];if(!isSolid(i.id))w+=0.5}});return w}
function drivePlan(){return D.streets.filter(s=>s.w>0).map(s=>({s,need:s.w*(1-covFrac(s))*(1+weakness(s.k))})).filter(o=>o.need>0.5).sort((a,b)=>b.need-a.need).slice(0,8).map(o=>o.s)}
const DKEY='fd8-drive';
let drv=null, gpsWatch=null, wakeLock=null, drvTick=null, stopArmed=0;
function saveDrv(){try{localStorage.setItem(DKEY,JSON.stringify(drv))}catch(e){}}
async function keepAwake(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&drv&&drv.active)keepAwake()});
function fmtDur(ms){const m=Math.floor(ms/60000),h=Math.floor(m/60);return h?`${h}:${String(m%60).padStart(2,'0')}`:`${m}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`}
function isDriven(k,h){const s=ST[k];if(!s||!h)return false;return h.length>=3||(h.length>=2&&h.length/s.ch.length>=0.6)||(s.ch.length===1&&h.length===1)}
function newStreetCount(){return Object.keys(drv.hits).filter(k=>!covOf(k).length&&isDriven(k,drv.hits[k])).length}
function startDrive(resume){
  if(!canGPS)return;
  if(!resume)drv={active:true,t0:Date.now(),pts:[],dist:0,hits:{},acc:null};
  drv.active=true;saveDrv();
  const ov=$('#driveov');ov.hidden=false;
  ov.innerHTML=`<div class="drivebig"><div class="rec"><span class="dotlive"></span>Recording drive</div>
   <div class="dstats"><div><b id="dtime">0:00</b><span>time</span></div><div><b id="ddist">0.0</b><span>miles</span></div><div><b id="dnew">0</b><span>new streets</span></div></div>
   <p class="muted" id="dgps">Waiting for GPS…</p>
   <p class="muted">Keep the phone mounted with the screen on. Nothing to read or tap until you park.</p>
   <button class="btn big" id="dstop">Stop and review</button></div>`;
  const upd=()=>{if(!drv)return;$('#dtime').textContent=fmtDur(Date.now()-drv.t0);$('#ddist').textContent=(drv.dist/1609.34).toFixed(1);$('#dnew').textContent=newStreetCount()};
  clearInterval(drvTick);drvTick=setInterval(upd,1000);upd();
  $('#dstop').onclick=()=>{if(Date.now()-stopArmed<3500){stopDrive();return}stopArmed=Date.now();$('#dstop').textContent='Tap again to stop';setTimeout(()=>{const b=$('#dstop');if(b)b.textContent='Stop and review'},3500)};
  keepAwake();
  gpsWatch=navigator.geolocation.watchPosition(onFix,err=>{const g=$('#dgps');if(!g)return;g.textContent=err.code===1?'Location is blocked. Allow location for this site in the browser settings, then start again.':'GPS signal lost. Still recording; it will pick back up.'},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}
let fixN=0;
function onFix(pos){
  if(!drv||!drv.active)return;
  const c=pos.coords;const g=$('#dgps');
  if(c.accuracy>40){if(g)g.textContent=`GPS weak (±${Math.round(c.accuracy)} m). Waiting for a better fix.`;return}
  if(g)g.textContent=`GPS good (±${Math.round(c.accuracy)} m)`;
  const [x,y]=P(c.longitude,c.latitude);const last=drv.pts[drv.pts.length-1];
  if(last){const step=Math.hypot(x-last[0],y-last[1]);if(step<5)return;if(step<400)drv.dist+=step}
  drv.pts.push([Math.round(x),Math.round(y),Date.now()]);
  // fill gaps so a fast pass still covers each 40 m chunk
  let pts=[[x,y]];
  if(last){const gap=Math.hypot(x-last[0],y-last[1]);if(gap<400){const n=Math.max(1,Math.ceil(gap/20));pts=[];for(let i=1;i<=n;i++)pts.push([last[0]+(x-last[0])*i/n,last[1]+(y-last[1])*i/n])}}
  for(const [px,py] of pts)for(const [k,i] of chunksNear(px,py,22)){const h=drv.hits[k]||(drv.hits[k]=[]);if(!h.includes(i))h.push(i)}
  if(++fixN%4===0)saveDrv();
}
function stopDrive(){
  if(gpsWatch!=null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null}
  clearInterval(drvTick);try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null;
  if(!drv){$('#driveov').hidden=true;return}
  const before={};const newly=[];const drove=[];
  for(const k in drv.hits){const s=ST[k];if(!s||!isDriven(k,drv.hits[k]))continue;const had=covOf(k);
    drove.push(k);if(!had.length)newly.push(k);
    state.cov[k]=[...new Set([...had,...drv.hits[k]])].sort((a,b)=>a-b);}
  drove.forEach(k=>state.driven[k]=Date.now());
  const summary={t:drv.t0,ms:Date.now()-drv.t0,dist:drv.dist,drove,newly,pts:drv.pts.map(p=>[p[0],p[1]])};
  drv=null;try{localStorage.removeItem(DKEY)}catch(e){}
  save();flushDb();showDriveReview(summary);
}
function showDriveReview(sm){
  const ov=$('#driveov');ov.hidden=false;
  const list=sm.drove.map(k=>ST[k]).filter(Boolean).sort((a,b)=>b.w-a.w);
  const weak=list.filter(s=>weakness(s.k)>0.6);
  ov.innerHTML=`<div class="view" style="position:relative;inset:auto;overflow:visible"><div class="stack">
   <div><p class="eyebrow">Drive review</p><h2>${list.length} street${list.length===1?'':'s'} driven, ${sm.newly.length} new</h2><p class="muted">${fmtDur(sm.ms)} · ${(sm.dist/1609.34).toFixed(1)} miles</p></div>
   <div class="drillmap" id="drvmap" style="border:1px solid var(--line);border-radius:var(--r);overflow:hidden"></div>
   ${weak.length?`<div class="card"><p class="eyebrow">You drove streets you're shaky on</p><p>${weak.slice(0,8).map(s=>esc(s.n)).join(', ')}</p><p class="muted" style="font-size:13.5px">Quizzing them now, while the drive is fresh, makes them stick.</p></div>`:''}
   ${list.length?`<button class="btn big" id="dquiz">Quiz me on these streets</button>`:'<p class="muted">No district streets matched this drive. GPS may have been weak, or the drive was outside the territory.</p>'}
   <button class="btn ghost" id="ddone">Done</button>
   ${list.length?`<div class="card"><p class="eyebrow">Streets driven</p>${list.map(s=>`<div class="planrow"><div>${esc(s.n)}${sm.newly.includes(s.k)?' <span>· new</span>':''}</div><span class="mono">${Math.round(100*covFrac(s))}% covered</span></div>`).join('')}</div>`:''}
  </div></div>`;
  const map=makeMap($('#drvmap',ov),{});map.setSectors(false);map.setLabels('auto');map.setCoverage(false);list.forEach(s=>map.hl(s.k,'hl'));map.track(sm.pts);
  requestAnimationFrame(()=>{if(sm.pts.length>1){const xs=sm.pts.map(p=>p[0]),ys=sm.pts.map(p=>p[1]);map.fit([Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)],0.1)}});
  const q=$('#dquiz',ov);if(q)q.onclick=()=>{ov.hidden=true;ov.innerHTML='';if(!startSessionFor(sm.drove)){show('train')}};
  $('#ddone',ov).onclick=()=>{ov.hidden=true;ov.innerHTML='';show('log')};
}
function driveSection(){
  const cs=coverageStats();const plan=drivePlan();let pending=null;try{pending=JSON.parse(localStorage.getItem(DKEY)||'null')}catch(e){}
  return `<div><p class="eyebrow">Drive the district</p><h2>Drive mode</h2><p class="muted">On your own time, in your own vehicle. The app records which streets you drive, then quizzes you on them after you park.</p></div>
   ${pending&&pending.active?`<div class="card"><p class="eyebrow">Unfinished drive</p><p>A drive was still recording when the app closed.</p><div class="row wrap"><button class="btn" id="dresume">Keep recording</button><button class="btn ghost" id="dfinish">Finish and review</button></div></div>`:''}
   ${canGPS?`<button class="btn big" id="dstart">Start a drive</button>`:`<div class="note">${PWA?'This browser has no location access.':'Drive mode works in the installed app. Claude’s site blocks GPS for pages like this one.'}</div>`}
   <div class="card"><p class="eyebrow">Coverage</p><div class="row" style="margin-bottom:6px"><b>${Math.round(cs.calls*100)}% of calls</b><span class="muted">are on streets you've driven</span></div><div class="covbar"><i style="width:${cs.calls*100}%"></i></div><p class="muted" style="font-size:13px;margin:8px 0 0">${Math.round(cs.len*100)}% of the district's street length driven. Turn on <b>Driven</b> on the Map tab to see where.</p></div>
   <div class="card"><p class="eyebrow">Worth driving next</p>${plan.length?plan.map(s=>`<div class="planrow"><div>${esc(s.n)} <span>· ${esc(SEC[s.sec]?SEC[s.sec].fam:'')}</span></div><span class="mono">${Math.round(100*covFrac(s))}% driven</span></div>`).join('')+`<div class="row" style="margin-top:10px"><button class="btn ghost" id="dplanmap">Show on map</button></div>`:'<p class="muted">Nothing left: you have driven the busy streets you struggle with.</p>'}<p class="muted" style="font-size:12.5px;margin:8px 0 0">Busy streets you haven't driven yet and streets you keep missing come first.</p></div>`;
}
/* ---------- Call log ---------- */
let logConf=3;
function renderLog(){
  const v=$('#v-log');
  v.innerHTML=`<div class="stack">${driveSection()}<div style="margin-top:10px"><p class="eyebrow">After a real call</p><h2>Log how the drive went</h2><p class="muted">Thirty seconds after you're back. Streets you were unsure on come up first in your next session.</p></div>
   <form class="card stack" id="logf" style="gap:12px">
    <div class="row" style="gap:10px;align-items:flex-end"><label class="f" style="width:90px">Number<input id="lnum" inputmode="numeric" pattern="[0-9]*" placeholder="2200"></label><label class="f" style="flex:1;min-width:0">Street<input id="lst" list="stlist2" placeholder="Westchester Dr" autocomplete="off" required></label><datalist id="stlist2">${D.streets.map(s=>`<option value="${esc(s.n)}">`).join('')}</datalist></div>
    <div><div style="font-weight:600;font-size:13.5px;margin-bottom:5px">How sure were you of the way?</div><div class="seg" id="lconf">${[1,2,3,4,5].map(n=>`<button type="button" aria-pressed="${n===logConf}" data-n="${n}">${n}</button>`).join('')}</div><div class="row muted" style="font-size:12px;margin-top:3px"><span>Lost</span><span class="spacer"></span><span>Automatic</span></div></div>
    <label class="check"><input type="checkbox" id="lhes">Hesitated at the bay door</label>
    <label class="check"><input type="checkbox" id="lmiss">Missed a turn or went the long way</label>
    <label class="f">Note<textarea id="lnote" rows="2" placeholder="e.g. took Ward to English, Burton was faster"></textarea></label>
    <div class="row"><span class="muted" id="lmsg" style="font-size:13px"></span><span class="spacer"></span><button class="btn" type="submit">Save</button></div>
   </form>
   <div class="card"><p class="eyebrow">Logged calls</p>${state.log.length?state.log.slice().reverse().map(l=>`<div class="logitem"><div><b>${esc((l.n?l.n+' ':'')+(ST[l.k]?ST[l.k].n:l.k))}</b></div><button data-t="${l.t}" aria-label="Delete entry">Delete</button><div class="meta">${new Date(l.t).toLocaleDateString('en-US',{month:'short',day:'numeric'})} · sure ${l.conf}/5${l.hes?' · hesitated':''}${l.miss?' · missed a turn':''}${l.note?' · '+esc(l.note):''}</div></div>`).join(''):'<p class="muted">No calls logged yet.</p>'}</div>
  </div>`;
  $$('#lconf button',v).forEach(b=>b.onclick=()=>{logConf=+b.dataset.n;$$('#lconf button',v).forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#logf',v).onsubmit=e=>{e.preventDefault();const name=$('#lst',v).value.trim().toLowerCase();const s=D.streets.find(x=>x.n.toLowerCase()===name)||D.streets.find(x=>x.n.toLowerCase().startsWith(name));
    if(!s){$('#lmsg',v).textContent='Pick a street from the list; that one is not in the territory.';return}
    const entry={t:Date.now(),k:s.k,n:parseInt($('#lnum',v).value)||null,conf:logConf,hes:$('#lhes',v).checked,miss:$('#lmiss',v).checked,note:$('#lnote',v).value.trim().slice(0,200)};
    state.log.push(entry);if(state.log.length>300)state.log.shift();
    if(entry.conf<=3||entry.hes||entry.miss){ITEMS.filter(i=>i.k===s.k).forEach(i=>{const r=state.items[i.id];if(r)r[2]=Date.now()})}
    save();renderLog();$('#lmsg').textContent=`Saved. ${entry.conf<=3||entry.hes||entry.miss?esc(s.n)+' moved to the front of your next session.':''}`};
  $$('.logitem button',v).forEach(b=>b.onclick=()=>{state.log=state.log.filter(l=>String(l.t)!==b.dataset.t);save();renderLog()});
  const ds=$('#dstart',v);if(ds)ds.onclick=()=>startDrive(false);
  const dp=$('#dplanmap',v);if(dp)dp.onclick=()=>{mapFocus={plan:drivePlan().map(s=>s.k)};show('map')};
  const dr=$('#dresume',v);if(dr)dr.onclick=()=>{try{drv=JSON.parse(localStorage.getItem(DKEY))}catch(e){}if(drv)startDrive(true)};
  const df=$('#dfinish',v);if(df)df.onclick=()=>{try{drv=JSON.parse(localStorage.getItem(DKEY))}catch(e){}stopDrive()};
}
/* ---------- boot ---------- */
show('train');
fixState();
let dbTries=0;(function tryDb(){if(window.claude&&window.claude.use){connectDb();return}if(++dbTries<12)setTimeout(tryDb,500)})();
if(PWA){syncMsg='Saved on this phone';renderTop();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
window.__fd8={ITEMS,SEC,ST,D,getState:()=>state,setS:v=>{S=v},openDrill,next,startSessionFor,simulateFix:(lon,lat,acc)=>onFix({coords:{longitude:lon,latitude:lat,accuracy:acc||8}}),matchWhich,matchOption};
})();
</script>
